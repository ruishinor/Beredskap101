        <h2>Beredskap101 - Kunnskapsoversikt Fallback</h2>
        <p>Beredskap og robusthet krever kunnskap og handling. Her er strukturen for kunnskapsoversikten:</p>
        
        <h3>1. Kjerneberedskap (Core Preparedness)</h3>
        <p>Grunnmuren for all beredskap starter med egenberedskap i hjemmet.</p>

        <h3>2. Kunnskapssøyler (Knowledge Pillars)</h3>
        <ul>
          <li><strong>01 Førstehjelp & Traumepleie (First Aid):</strong> Taktisk akuttmedisinsk kompetanse og prosedyre for bruk av tourniquet.</li>
          <li><strong>02 Villmark & Overlevelse (Wilderness Survival):</strong> Overlevelsesferdigheter, navigasjon og elvekryssing.</li>
          <li><strong>03 Egensikkerhet & Situasjonsbevissthet (Personal Safety):</strong> Situasjonsforståelse, deeskalering og konflikthåndtering.</li>
          <li><strong>04 Egenberedskap i hjemmet (Household Preparedness):</strong> Sikring av vann, strøm, mat og nødkommunikasjon.</li>
          <li><strong>05 Digitalt Personvern (Digital Privacy):</strong> Beskyttelse av personlige digitale data og mobile enheter.</li>
          <li><strong>06 Reisesikkerhet & Risiko (Travel Security):</strong> Risikoanalyse, nødplaner og forebyggende tiltak på reise.</li>
        </ul>

        <h3>3. Progressive Steg (Progressive Discovery)</h3>
        <ol>
          <li>Kjerne (Core) - Etabler grunnmuren</li>
          <li>Kategori (Category) - Velg en kunnskapssøyle</li>
          <li>Temaer (Topics) - Utforsk prosedyrer (SOPs)</li>
          <li>Guider (Guides) - Studer tiltakene i detalj</li>
          <li>Handlinger (Actions) - Utfør og bekreft handlinger</li>
        </ol>
      </div>
