name: verify
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_dependency_audit:
        description: Send dependency metadata to npm for a vulnerability audit
        type: boolean
        default: false
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci --no-audit
      - run: npm run verify:text-integrity
      - run: npm run verify
      - run: npm run verify:security
        if: github.event_name == 'workflow_dispatch' && inputs.run_dependency_audit == true
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci --no-audit
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: test-results/ }
